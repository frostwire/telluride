name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'telluride-build-*'

jobs:
  build:
    # Apple Silicon runner so the produced binary is really arm64.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner architecture
        # Fail fast if the runner label ever stops meaning Apple
        # Silicon (see build-macos-x86_64.yml: a mislabeled
        # architecture ships a binary that fails with
        # "Bad CPU type in executable" on the other architecture).
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade --no-cache-dir astroid
          python3 -m pip install --upgrade --no-cache-dir pylint
          python3 -m pip install --upgrade --no-cache-dir yt_dlp
          python3 -m pip install --upgrade --no-cache-dir pyinstaller

      - name: Run pylint
        run: |
          python3 -m pylint --max-line-length=350 telluride.py

      - name: Build with PyInstaller
        # --onedir, not --onefile: --onefile re-extracts into a fresh
        # random _MEIxxxxxx folder and macOS re-validates every Mach-O
        # on every launch (~8s). The --onedir folder is embedded in the
        # single-file native launcher telluride_macos.arm64
        # (launcher.c, macos_launcher.sh), the file FrostWire looks
        # for: its first run unpacks the folder once into
        # ~/Library/Caches/com.frostwire.Telluride/ and later runs
        # start in ~0.1s. No Developer ID identity is available on the
        # runner, so PyInstaller ad-hoc signs the nested binaries and
        # the launcher is ad-hoc signed below (unsigned binaries are
        # killed by Gatekeeper/AMFI). For a Developer ID signed,
        # notarized binary, run sign.sh on a machine with the cert: it
        # re-signs the folder, re-embeds it and signs the launcher.
        run: |
          pyinstaller --onedir --noupx \
            --osx-bundle-identifier com.frostwire.Telluride \
            --osx-entitlements-file Entitlements.plist \
            telluride.py
          mv dist/telluride telluride_macos.arm64.dir
          ./macos_launcher.sh arm64
          codesign --force --sign - --options runtime --entitlements Entitlements.plist telluride_macos.arm64
          file telluride_macos.arm64
          file telluride_macos.arm64 | grep -q "arm64"
          file telluride_macos.arm64.dir/telluride | grep -q "arm64"

      - name: Smoke test the single file
        # Run the launcher alone, away from its .dir folder, with an
        # empty cache: the first run must unpack and start telluride.
        run: |
          mkdir -p smoke/home
          cp telluride_macos.arm64 smoke/
          cd smoke
          HOME="$PWD/home" ./telluride_macos.arm64 --version | grep -q "Build"
          HOME="$PWD/home" ./telluride_macos.arm64 --version | grep -q "Build"
          ls home/Library/Caches/com.frostwire.Telluride/

      - name: Organize artifact
        # Put the launcher file and its .dir folder directly in the
        # artifact folder: upload-artifact zips them, so downloading
        # the artifact and unzipping it once gives the single-file
        # product telluride_macos.arm64 (ad-hoc signed) plus the
        # telluride_macos.arm64.dir/ folder it embeds, which sign.sh
        # needs to re-sign and re-embed with the Developer ID. Do not
        # ditto-zip them first, or the artifact is a zip in a zip.
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "${{ github.ref }}" ]; then
            TAG_NAME="manual-build"
          fi
          mkdir -p "$TAG_NAME"
          mv telluride_macos.arm64 telluride_macos.arm64.dir "$TAG_NAME/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telluride_macos_arm64
          path: ${{ github.ref_name != '' && github.ref_name || 'manual-build' }}
          retention-days: 90
