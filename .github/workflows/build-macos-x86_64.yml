name: Build macOS x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'telluride-build-*'

jobs:
  build:
    # Intel runner so the produced binary is really x86_64 (native),
    # not an arm64 binary with an x86_64 name.
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner architecture
        # Fail fast if the runner label ever stops meaning Intel:
        # building on an Apple Silicon runner silently produces an
        # arm64 binary that gets renamed telluride_macos.x86_64 and
        # then fails on Intel Macs with "Bad CPU type in executable"
        # (this is what the old macos-14 runner did).
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade --no-cache-dir astroid
          python3 -m pip install --upgrade --no-cache-dir pylint
          python3 -m pip install --upgrade --no-cache-dir yt_dlp
          python3 -m pip install --upgrade --no-cache-dir pyinstaller

      - name: Run pylint
        run: |
          python3 -m pylint --max-line-length=350 telluride.py

      - name: Build with PyInstaller
        # --onedir, not --onefile: --onefile re-extracts into a fresh
        # random _MEIxxxxxx folder and macOS re-validates every Mach-O
        # on every launch (~8s). --onedir ships a pre-signed folder
        # and starts in ~0.2s. A native launcher (launcher.c) is the
        # telluride_macos.x86_64 file FrostWire looks for and execs
        # the bundle in telluride_macos.x86_64.dir/. No Developer ID
        # identity is available on the runner, so PyInstaller ad-hoc
        # signs the nested binaries; the launcher is ad-hoc signed
        # below so it is not left unsigned (unsigned/quarantined
        # binaries are killed by Gatekeeper/AMFI even with the
        # Privacy & Security override). For a Developer ID signed,
        # notarized binary, run sign.sh on a machine with the cert.
        run: |
          pyinstaller --onedir --noupx \
            --osx-bundle-identifier com.frostwire.Telluride \
            --osx-entitlements-file Entitlements.plist \
            telluride.py
          mv dist/telluride telluride_macos.x86_64.dir
          cc -O2 -arch x86_64 -o telluride_macos.x86_64 launcher.c
          codesign --force --sign - --options runtime --entitlements Entitlements.plist telluride_macos.x86_64
          file telluride_macos.x86_64
          file telluride_macos.x86_64 | grep -q "x86_64"
          file telluride_macos.x86_64.dir/telluride | grep -q "x86_64"

      - name: Organize artifact
        # Put the launcher file and its .dir folder directly in the
        # artifact folder: upload-artifact zips them, so downloading
        # the artifact and unzipping it once gives the final product
        # (telluride_macos.x86_64 + telluride_macos.x86_64.dir/) at
        # the top level, ready to sign locally with sign.sh. Do not
        # ditto-zip them first, or the artifact is a zip in a zip.
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "${{ github.ref }}" ]; then
            TAG_NAME="manual-build"
          fi
          mkdir -p "$TAG_NAME"
          mv telluride_macos.x86_64 telluride_macos.x86_64.dir "$TAG_NAME/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telluride_macos_x86_64
          path: ${{ github.ref_name != '' && github.ref_name || 'manual-build' }}
          retention-days: 90
