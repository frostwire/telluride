name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - 'telluride-build-*'

jobs:
  build:
    # Apple Silicon runner so the produced binary is really arm64.
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner architecture
        # Fail fast if the runner label ever stops meaning Apple
        # Silicon (see build-macos-x86_64.yml: a mislabeled
        # architecture ships a binary that fails with
        # "Bad CPU type in executable" on the other architecture).
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade --no-cache-dir astroid
          python3 -m pip install --upgrade --no-cache-dir pylint
          python3 -m pip install --upgrade --no-cache-dir yt_dlp
          python3 -m pip install --upgrade --no-cache-dir pyinstaller

      - name: Run pylint
        run: |
          python3 -m pylint --max-line-length=350 telluride.py

      - name: Build with PyInstaller
        # --onedir, not --onefile: --onefile re-extracts into a fresh
        # random _MEIxxxxxx folder and macOS re-validates every Mach-O
        # on every launch (~8s). --onedir ships a pre-signed folder
        # and starts in ~0.2s. No Developer ID identity is available
        # on the runner, so PyInstaller ad-hoc signs the nested
        # binaries; the maintainer re-signs/notarizes after download.
        run: |
          pyinstaller --onedir --noupx \
            --osx-bundle-identifier com.frostwire.Telluride \
            --osx-entitlements-file Entitlements.plist \
            telluride.py
          mv dist/telluride telluride_macos.arm64
          file telluride_macos.arm64/telluride
          file telluride_macos.arm64/telluride | grep -q "arm64"
          ditto -c -k --sequesterRsrc --keepParent telluride_macos.arm64 telluride_macos.arm64.zip

      - name: Organize artifact
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "${{ github.ref }}" ]; then
            TAG_NAME="manual-build"
          fi
          mkdir -p "$TAG_NAME"
          mv telluride_macos.arm64.zip "$TAG_NAME/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telluride_macos_arm64
          path: ${{ github.ref_name != '' && github.ref_name || 'manual-build' }}
          retention-days: 90
